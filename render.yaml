services:
  - type: web
    name: labnet-guardian-backend
    runtime: node
    repo: https://github.com/MphephuSamuel/labnet_backend
    branch: development
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
