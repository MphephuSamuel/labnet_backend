<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LabNet Guardian — Redirecting…</title>
    <style>
      body {
        font-family:
          system-ui,
          Segoe UI,
          Roboto,
          Arial;
        padding: 24px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Opening app…</h1>
    <p id="msg">
      If your app doesn't open automatically, follow the instructions below.
    </p>

    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const oobCode =
          params.get("oobCode") ||
          params.get("oobcode") ||
          params.get("oob") ||
          params.get("code");
        const email = params.get("email");

        // Custom app scheme
        const appScheme = "labnetguardian";
        let appUrl = `${appScheme}://reset`;
        if (oobCode) {
          appUrl += `?oobCode=${encodeURIComponent(oobCode)}`;
          if (email) {
            appUrl += `&email=${encodeURIComponent(email)}`;
          }
        }

        // Try to open the installed app
        window.location.href = appUrl;

        // Fallback: after a short delay, show friendly message and open button
        setTimeout(() => {
          const fallback = document.createElement("div");
          fallback.style.marginTop = "20px";
          fallback.innerHTML = `
          <p>Your password reset process is complete!</p>
          <p>If the app did not open automatically, click the button below:</p>
          <p><a href="${appUrl}" style="display:inline-block; padding:12px 24px; background:#7B2FBE; color:white; text-decoration:none; border-radius:30px; font-weight:bold; box-shadow: 0 4px 10px rgba(123,47,190,0.3);">Open LabNet Guardian</a></p>
          ${oobCode ? `<p style="font-size:12px; color:#9E9EB8; margin-top:20px;">Verification Code: <code>${oobCode}</code></p>` : ""}
        `;
          document.body.appendChild(fallback);
        }, 1200);
      })();
    </script>
  </body>
</html>
